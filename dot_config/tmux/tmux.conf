set -g mouse on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -g automatic-rename off
set -g allow-rename off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g status-interval 2
set -g status-left-length 100
set -g status-right-length 100

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind c command-prompt -p "Nombre de la ventana:" "new-window -n '%%'"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

set -g pane-border-style fg='#4d5357'
set -g pane-active-border-style fg='#3daee9'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh nvim vim less tail htop'

set -g status-style "bg=#31363b,fg=#fcfcfc"
set -g message-style "bg=#31363b,fg=#3daee9"
set -g message-command-style "bg=#31363b,fg=#3daee9"
set -g mode-style "bg=#3daee9,fg=#232627"

set -g status-left "#[bg=#3daee9,fg=#232627,bold] #S #[default] "

set -g window-status-format "#[fg=#7f8c8d] #I #W "
set -g window-status-current-format "#[bg=#4d5357,fg=#fcfcfc,bold] #I #[fg=#3daee9]#W #[default]"
set -g window-status-separator ""

set -g @prefix_highlight_fg '#232627'
set -g @prefix_highlight_bg '#fdbc4b'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#232627,bg=#1cdc9a'
set -g status-right "#{prefix_highlight} #[fg=#7f8c8d]CPU #[fg=#fcfcfc]#{cpu_percentage}  #[fg=#7f8c8d]RAM #[fg=#fcfcfc]#{ram_percentage} "

run '~/.config/tmux/plugins/tpm/tpm'
